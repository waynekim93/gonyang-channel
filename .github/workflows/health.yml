name: gonyang health

on:
  # 빈 회차 감시: 공개(07 · 12 · 18 · 21시 KST) 몇 시간 전에 예약이 다 찼는지 확인 → 비었으면 제작 다시 돌림 + 디스코드 알림.
  # 제작(autopilot)이 밤 · 새벽 · 오전에 도니까, 그 사이 빈틈(오후 · 저녁 회차)을 메우는 시각에 돌림.
  schedule:
    - cron: "33 21 * * *"  # KST 06:33 — 07 · 12 · 18시편
    - cron: "23 6 * * *"   # KST 15:23 — 18 · 21시편
    - cron: "43 10 * * *"  # KST 19:43 — 21시편
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 빈 회차가 있으면 autopilot 워크플로를 다시 실행

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check slots & login
        id: check
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN_GONYANG }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ALERT_CHANNEL: ${{ secrets.DISCORD_ALERT_CHANNEL }}
        run: |
          out=$(python healthcheck.py); code=$?
          echo "$out"
          if echo "$out" | grep -q REFILL; then echo "refill=true" >> "$GITHUB_OUTPUT"; fi
          exit $code

      - name: Refill empty slots
        if: always() && steps.check.outputs.refill == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run autopilot.yml -R "${{ github.repository }}"
